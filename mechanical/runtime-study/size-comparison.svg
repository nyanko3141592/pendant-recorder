<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="780" viewBox="0 0 1000 780"><rect width="1000" height="780" fill="#f7f6f2"/><style>text{font-family:'Hiragino Sans','Arial',sans-serif;fill:#253532}.title{font-size:27px;font-weight:700}.head{font-size:21px;font-weight:600}.small{font-size:15px}.muted{fill:#62736e}</style><text x="48" y="48" class="title">48時間録音を目指す、2つのサイズ案</text><text x="48" y="78" class="small muted">外形の設計目標を同じ縮尺で比較。実装・寿命は未検証／画面上の実寸ではありません</text><text x="260" y="127" text-anchor="middle" class="head">A · Omiサイズを維持</text><circle cx="260" cy="270" r="102.0" fill="#dce5e0" stroke="#354c43" stroke-width="2"/><text x="260" y="262" text-anchor="middle" class="head">25.5 mm</text><text x="260" y="290" text-anchor="middle" class="small muted">正面・円形</text><path d="M158.0 408H362.0 M158.0 401V415 M362.0 401V415" stroke="#62736e"/><text x="260" y="433" text-anchor="middle" class="small">直径 25.5 mm</text><rect x="158.0" y="470" width="204.0" height="120" rx="13" fill="#dce5e0" stroke="#354c43" stroke-width="2"/><text x="260" y="522" text-anchor="middle" class="small">側面</text><text x="260" y="548" text-anchor="middle" class="head">厚さ 15 mm</text><text x="260" y="632" text-anchor="middle" class="head">150 mAh / 2.0 mA以下を目標</text><text x="260" y="660" text-anchor="middle" class="small muted">裸セル寸法：16 × 5.4 mm</text><text x="730" y="127" text-anchor="middle" class="head">B · 直径を2.5mm広げる</text><circle cx="730" cy="270" r="112.0" fill="#dce5e0" stroke="#354c43" stroke-width="2"/><text x="730" y="262" text-anchor="middle" class="head">28 mm</text><text x="730" y="290" text-anchor="middle" class="small muted">正面・円形</text><path d="M618.0 408H842.0 M618.0 401V415 M842.0 401V415" stroke="#62736e"/><text x="730" y="433" text-anchor="middle" class="small">直径 28 mm</text><rect x="618.0" y="470" width="224.0" height="120" rx="13" fill="#dce5e0" stroke="#354c43" stroke-width="2"/><text x="730" y="522" text-anchor="middle" class="small">側面</text><text x="730" y="548" text-anchor="middle" class="head">厚さ 15 mm</text><text x="730" y="632" text-anchor="middle" class="head">210 mAh / 3.0 mA以下を目標</text><text x="730" y="660" text-anchor="middle" class="small muted">裸セル寸法：24 × 4.15 mm</text><path d="M80 715H240 M80 709V721 M160 709V721 M240 709V721" stroke="#253532" stroke-width="2"/><text x="80" y="745" class="small">0</text><text x="150" y="745" class="small">10</text><text x="225" y="745" class="small">20 mm</text><text x="350" y="720" class="small">使用可能容量70%と仮定：Aは2mAで52.5時間、Bは3mAで49時間</text><text x="350" y="746" class="small muted">セル公称値：Grepow GRP1654M1 / GRP2440R1。保護・配線は別途。</text></svg>